<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Segoe UI, Arial, sans-serif">
  <!-- Diagram contoh infografis dengan 6 penanda anatomi (untuk hotspot) -->
  <rect width="960" height="540" fill="#FFFFFF"/>

  <!-- panel infografis contoh -->
  <g>
    <rect x="60" y="50" width="600" height="420" rx="14" fill="#F7F8FA" stroke="#E3E6EC"/>
    <text x="90" y="96" font-size="19" font-weight="800" fill="#2B3078">Alur Klaim JKN: dari faskes ke penyelesaian</text>
    <text x="90" y="118" font-size="12.5" fill="#4A5060">Contoh infografis proses dengan satu pesan utama</text>

    <!-- flow 4 langkah -->
    <g font-size="12.5" text-anchor="middle">
      <rect x="90" y="150" width="120" height="58" rx="8" fill="#2B3078"/>
      <text x="150" y="175" fill="#fff" font-weight="700">1. Daftar</text>
      <text x="150" y="192" fill="#D9DCEB">faskes 1</text>

      <rect x="240" y="150" width="120" height="58" rx="8" fill="#3A4192"/>
      <text x="300" y="175" fill="#fff" font-weight="700">2. Rujukan</text>
      <text x="300" y="192" fill="#D9DCEB">bila perlu</text>

      <rect x="390" y="150" width="120" height="58" rx="8" fill="#009F3C"/>
      <text x="450" y="175" fill="#fff" font-weight="700">3. Layanan</text>
      <text x="450" y="192" fill="#D9F4E3">rawat</text>

      <rect x="540" y="150" width="120" height="58" rx="8" fill="#009F3C"/>
      <text x="600" y="175" fill="#fff" font-weight="700">4. Klaim</text>
      <text x="600" y="192" fill="#D9F4E3">teradministrasi</text>
    </g>
    <path d="M210 179 h30 M360 179 h30 M510 179 h30" stroke="#7A8090" stroke-width="2.5"/>

    <!-- angka ilustratif -->
    <g text-anchor="middle">
      <rect x="90" y="250" width="170" height="90" rx="8" fill="#EEF0F8"/>
      <text x="175" y="288" font-size="26" font-weight="800" fill="#2B3078">270 jt</text>
      <text x="175" y="312" font-size="12" fill="#4A5060">peserta JKN*</text>

      <rect x="280" y="250" width="170" height="90" rx="8" fill="#E7F6EC"/>
      <text x="365" y="288" font-size="26" font-weight="800" fill="#007A2E">98%</text>
      <text x="365" y="312" font-size="12" fill="#4A5060">faskes rujukan terhubung*</text>

      <rect x="470" y="250" width="170" height="90" rx="8" fill="#FFF7D6"/>
      <text x="555" y="288" font-size="26" font-weight="800" fill="#8A6D00">10 hari</text>
      <text x="555" y="312" font-size="12" fill="#4A5060">rata-rata verifikasi*</text>
    </g>

    <text x="90" y="392" font-size="12.5" fill="#4A5060">*Angka ilustratif untuk contoh pembelajaran — bukan data resmi.</text>
    <text x="90" y="416" font-size="12.5" fill="#7A8090" font-style="italic">Sumber: contoh oleh tim modul (2026); ganti dengan data resmi BPJS Kesehatan saat digunakan.</text>
  </g>

  <!-- penanda anatomi 1-6 -->
  <g font-size="14" font-weight="800" text-anchor="middle">
    <circle cx="76" cy="88" r="16" fill="#C8102E"/><text x="76" y="93" fill="#fff">1</text>
    <circle cx="676" cy="96" r="16" fill="#C8102E"/><text x="676" y="101" fill="#fff">2</text>
    <circle cx="150" cy="140" r="16" fill="#C8102E"/><text x="150" y="145" fill="#fff">3</text>
    <circle cx="175" cy="295" r="16" fill="#C8102E"/><text x="175" y="300" fill="#fff">4</text>
    <circle cx="76" cy="388" r="16" fill="#C8102E"/><text x="76" y="393" fill="#fff">5</text>
    <circle cx="76" cy="412" r="16" fill="#C8102E"/><text x="76" y="417" fill="#fff">6</text>
  </g>

  <text x="480" y="508" text-anchor="middle" font-size="14.5" fill="#4A5060" font-weight="600">Klik penanda bernomor untuk mempelajari anatomi infografis yang baik.</text>
  <text x="480" y="530" text-anchor="middle" font-size="12.5" fill="#7A8090" font-style="italic">Ilustrasi tim modul (2026) — angka bersifat ilustratif — bebas lisensi.</text>
</svg>
