<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Segoe UI, Arial, sans-serif">
  <!-- Diagram: alur desain pembelajaran dari kebutuhan ke transfer -->
  <rect x="0" y="0" width="960" height="300" fill="#FFFFFF"/>
  <text x="480" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#2B3078">Alur desain dimulai dari kebutuhan, bukan dari PowerPoint</text>

  <!-- 7 langkah chevron -->
  <g font-size="14.5" font-weight="600" text-anchor="middle">
    <path d="M40 90 h100 l22 45 -22 45 h-100 z" fill="#2B3078"/>
    <text x="90" y="128" fill="#fff">1. Kenali</text>
    <text x="90" y="148" fill="#fff">peserta &amp; gap</text>

    <path d="M150 90 h100 l22 45 -22 45 h-100 l22 -45 z" fill="#3A4192"/>
    <text x="200" y="128" fill="#fff">2. Tetapkan</text>
    <text x="200" y="148" fill="#fff">hasil terukur</text>

    <path d="M260 90 h100 l22 45 -22 45 h-100 l22 -45 z" fill="#009F3C"/>
    <text x="310" y="128" fill="#fff">3. Tentukan</text>
    <text x="310" y="148" fill="#fff">bukti asesmen</text>

    <path d="M370 90 h100 l22 45 -22 45 h-100 l22 -45 z" fill="#009F3C"/>
    <text x="420" y="128" fill="#fff">4. Rancang</text>
    <text x="420" y="148" fill="#fff">aktivitas &amp; alur</text>

    <path d="M480 90 h100 l22 45 -22 45 h-100 l22 -45 z" fill="#3A4192"/>
    <text x="530" y="128" fill="#fff">5. Pilih</text>
    <text x="530" y="148" fill="#fff">media/teknologi</text>

    <path d="M590 90 h100 l22 45 -22 45 h-100 l22 -45 z" fill="#2B3078"/>
    <text x="640" y="128" fill="#fff">6. Praktikkan</text>
    <text x="640" y="148" fill="#fff">dan ajarkan</text>

    <path d="M700 90 h100 l22 45 -22 45 h-100 l22 -45 z" fill="#C8102E"/>
    <text x="750" y="128" fill="#fff">7. Telaah &amp;</text>
    <text x="750" y="148" fill="#fff">revisi</text>
  </g>

  <!-- garis umpan balik revisi -->
  <path d="M750 190 v40 h-610 v-40" fill="none" stroke="#C8102E" stroke-width="2.5" stroke-dasharray="7 5"/>
  <path d="M140 196 l-9 10 9 10" fill="none" stroke="#C8102E" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="445" y="252" text-anchor="middle" font-size="14" fill="#C8102E" font-weight="600">Umpan balik → revisi → uji kembali (siklus perbaikan)</text>

  <text x="480" y="284" text-anchor="middle" font-size="12.5" fill="#7A8090" font-style="italic">Ilustrasi tim modul (2026), diadaptasi dari materi ToT Workshop Jaminan Sosial — bebas lisensi.</text>
</svg>
